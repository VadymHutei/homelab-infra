server {
    listen 80;
    listen [::]:80;

    server_name passgen.ukubuka.net;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name passgen.ukubuka.net;

    ssl_certificate /etc/letsencrypt/live/ukubuka.net-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ukubuka.net-0001/privkey.pem;

    location /static/ {
        alias /var/www/passgen/static/;
        access_log off;

        expires 30d;
        add_header Cache-Control "public";
    }

    location /favicon.ico {
        alias /var/www/passgen/static/favicon.ico;
        access_log off;

        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://passgen:5001;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_redirect off;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;

    ssl_reject_handshake on;
}